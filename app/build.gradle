plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id "kotlin-parcelize"
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def getTestInstrumentationRunner = {
    project.hasProperty('cucumber')
            ? 'in.delog.ssb.test.Instrumentation'
            : 'androidx.test.runner.AndroidJUnitRunner'
}

android {
    namespace 'in.delog'
    compileSdk 34
    //ndkVersion "25.1.8937393" // ndk is loaded apart of the gradle build
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
    splits {
        // Configures multiple APKs based on ABI. This helps keep the size
        // down, since PT binaries can be large.
        abi {
            // Enables building multiple APKs per ABI.
            //isEnable = true
            // By default, all ABIs are included, so use reset() and include to specify
            // that we only want APKs for x86 and x86_64, armeabi-v7a, and arm64-v8a.
            // Resets the list of ABIs that Gradle should create APKs for to none.
            reset()
            // Specifies a list of ABIs that Gradle should create APKs for.
            include("x86", "armeabi-v7a", "arm64-v8a", "x86_64")
            // Specify whether you wish to also generate a universal APK that
            // includes _all_ ABIs.
            //isUniversalApk = true
        }
    }

    defaultConfig {
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        applicationId  "in.delog.ssb"
        testApplicationId  "in.delog.ssb.test"
        testInstrumentationRunner getTestInstrumentationRunner()
        ndk.abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation"  : "$projectDir/schemas".toString(),
                        "room.incremental"     : "true",
                        "room.expandProjection": "true"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    // To let the libs be included in other projects
    externalNativeBuild {
        ndkBuild {
            path "../jni/Android.mk"
        }
    }


    packagingOptions {
        jniLibs.useLegacyPackaging = true
        resources {
            excludes += [
                    'META-INF/INDEX.LIST',
                    'META-INF/*.md',
                    'META-INF/io.netty.versions.properties',
                    'META-INF/DEPENDENCIES',
                    'META-INF/spring.*',
                    'META-INF/cxf/*',
            ]
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
        animationsDisabled true
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.8"
    }
}

task nativeLibsToJar(type: Jar, description: 'create a jar archive of the native libs') {
    from fileTree(dir: 'libs', include: '**/*.so')
    into 'lib/'
}

tasks.withType(JavaCompile) {
    compileTask -> compileTask.dependsOn(nativeLibsToJar)
}

