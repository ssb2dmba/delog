name: Android Tests

on:
  pull_request:
    branches: [main, devel]
  push:
    branches: [main, devel]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        api-level: [26]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: build tests
        run: ./gradlew assembleDebug assembleAndroidTest --no-daemon --stacktrace

      - name: run connectedCheck
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          disable-animations: true
          force-avd-creation: false
          ndk: 25.1.8937393
          emulator-options: -skin 1920x1080 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: | 
            ./gradlew connectedCheck --no-daemon --stacktrace

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: api-${{ matrix.api-level }}-instrumentation-results
          path: |
            emulator.log
            ./**/build/reports/androidTests/connected/**


      - name: run connectedCheck
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          disable-animations: true
          force-avd-creation: false
          ndk: 25.1.8937393
          emulator-options: -skin 1920x1080 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew connectedCheck  -Pcucumber --no-daemon --stacktrace

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: api-${{ matrix.api-level }}-cucumber-results
          path: |
            emulator.log
            ./**/build/reports/androidTests/connected/**

