name: Test/Build Android

on:
  pull_request:
    branches: [main, devel, fix-tests]
  push:
    branches: [main, devel, fix-tests]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: run connectedCheck
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          ndk: 25.1.8937393
          emulator-options: -skin 1920x1080 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedCheck -PrunInGithubCi=true -PcucumberUseAndroidJUnitRunner=false --no-daemon

