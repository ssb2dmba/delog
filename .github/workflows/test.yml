name: Android Tests

on:
  pull_request:
    branches: [main, devel]
  push:
    branches: [main, devel]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          android: false # kept

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup cache gradle wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            $HOME/.m2/repository
            ~/.m2/repository
            ./.gradle
            app/build
            libsodium
          key: gradle-${{ runner.os }}-shared-cache
          restore-keys: |
            gradle-${{ runner.os }}-shared-cache
      - name: Change wrapper permissions
        run: chmod +x ./gradlew
      - name: clean previous build
        run: ./gradlew clean
      - name: build tests
        run: ./gradlew assembleDebug assembleAndroidTest

  test:
    name: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        api-level: [ 26, 33 ]
    needs: [build]
    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          android: false # kept

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup cache gradle wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
            ./.gradle
            app/build
            libsodium
          key: gradle-${{ runner.os }}-shared-cache
          restore-keys: |
            gradle-${{ runner.os }}-shared-cache

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: run connectedCheck
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          target: ${{ matrix.api-level != 33 && 'default' || 'aosp_atd' }}
          disable-animations: true
          heap-size: ${{ matrix.api-level != 24 && '512M' || '' }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          channel: canary
          sdcard-path-or-size: 2048M
          ndk: 25.1.8937393
          script: | 
            ./gradlew connectedCheck

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-${{ matrix.api-level }}-instrumentation-results
          path: |
            emulator.log
            ./**/build/reports/androidTests/connected/**

      - name: run connectedCheck
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          target: ${{ matrix.api-level != 33 && 'default' || 'aosp_atd' }}
          disable-animations: true
          heap-size: ${{ matrix.api-level != 24 && '512M' || '' }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          channel: canary
          sdcard-path-or-size: 2048M
          ndk: 25.1.8937393
          script: |
            ./gradlew connectedCheck  -Pcucumber

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-${{ matrix.api-level }}-cucumber-results
          path: |
            emulator.log
            ./**/build/reports/androidTests/connected/**

